<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard – Dealership-test (Gmail · GitHub · Notion · Supabase)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050b1f;--panel:#0b1530;--line:#1c2a4a;--muted:#8a97b5;--text:#e8edf8;--green:#22e3a0;--yellow:#f5c542;--red:#ff5c6c;--blue:#4c8dff}
  *{box-sizing:border-box}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.5px;color:#fff}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  h2{font-size:15px;margin:0 0 12px;font-weight:600;color:#fff}
  .search{margin-top:4px}
  #q{width:100%;padding:13px 16px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:#fff;outline:none;font-family:inherit}
  #q:focus{border-color:var(--blue)}
  .filters{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filters label{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--text)}
  .filters input{accent-color:var(--green)}
  #summary{margin:4px 0 12px;font-size:13px;color:var(--muted)} #summary b{color:#fff}
  .res{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-right:8px;letter-spacing:.6px}
  .b-gmail{background:rgba(255,92,108,.15);color:#ff8a96}.b-github{background:rgba(76,141,255,.15);color:#8db4ff}
  .b-notion{background:rgba(200,200,220,.12);color:#d6dbea}.b-supabase{background:rgba(34,227,160,.13);color:var(--green)}
  .title{font-weight:600;font-size:15px}.meta{font-size:12px;color:var(--muted);margin:4px 0}
  .snip{font-size:13px;margin:6px 0;color:#c9d2e6}.file{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .file a{color:var(--blue);text-decoration:none;cursor:pointer} mark{background:rgba(245,197,66,.3);color:#fff;border-radius:3px;padding:0 2px}
  #viewer{white-space:pre-wrap;background:#020614;border:1px solid var(--line);color:#cfe;padding:12px;border-radius:12px;font-size:12px;display:none;margin-top:10px;max-height:320px;overflow:auto}
  footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Dashboard</h1>
    <div class="sub">Dealership-test · Data exports from Gmail, GitHub, Notion y Supabase (datos de prueba)</div>
  </div>
  <div class="pill">Source: <b>dataExports/</b> · local only</div>
</header>

<div class="card search">
  <h2>Search all services · Buscar en todo</h2>
  <input id="q" placeholder="Search everything… try: financing, Forza, Vento, TikTok" autofocus>
  <div class="filters" id="filters"></div>
  <div id="summary"></div>
  <div id="results"></div>
  <div id="viewer"></div>
</div>
<footer>Run: python3 dashboard/server.py · All data is fake test data.</footer>
</div>
<script>
const SERVICES=["gmail","github","notion","supabase"];
const LABEL={gmail:"Gmail",github:"GitHub",notion:"Notion",supabase:"Supabase"};
const active=new Set(SERVICES);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hl(text,terms){let t=esc(text);terms.forEach(w=>{if(!w)return;const r=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");t=t.replace(r,"<mark>$1</mark>");});return t;}
const f=document.getElementById("filters");
SERVICES.forEach(s=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" checked data-s="${s}"> ${LABEL[s]} <span id="c-${s}" style="color:var(--muted)"></span>`;f.appendChild(l);});
f.addEventListener("change",e=>{const s=e.target.dataset.s;e.target.checked?active.add(s):active.delete(s);run();});
const q=document.getElementById("q");let timer;
q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,150);});
async function run(){
  const query=q.value;const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
  const d=await (await fetch("/api/search?q="+encodeURIComponent(query)+"&services="+[...active].join(","))).json();
  SERVICES.forEach(s=>document.getElementById("c-"+s).textContent="("+d.counts[s]+")");
  document.getElementById("summary").innerHTML="<b>"+d.total+"</b> result"+(d.total===1?"":"s")+(query?` for "${esc(query)}"`:" (showing everything)");
  document.getElementById("results").innerHTML=d.results.map(x=>`
    <div class="res">
      <span class="badge b-${x.service}">${LABEL[x.service]}</span><span class="title">${hl(x.title,terms)}</span>
      <div class="meta">${esc(x.meta)}</div>
      <div class="snip">${hl(x.snippet,terms)}</div>
      <div class="file">File: <a onclick="openFile('${esc(x.file)}')">${esc(x.file)}</a>${x.url?` · <a href="${esc(x.url)}" target="_blank" rel="noopener">open original</a>`:""}</div>
    </div>`).join("");
}
async function openFile(p){const v=document.getElementById("viewer");v.style.display="block";v.textContent=await (await fetch("/api/file?path="+encodeURIComponent(p))).text();v.scrollIntoView();}
q.value=new URLSearchParams(location.search).get("q")||"";
run();
</script>
</body>
</html>
